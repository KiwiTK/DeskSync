name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS-arm64
            target: aarch64-apple-darwin
          - os: macos-13
            label: macOS-x86_64
            target: x86_64-apple-darwin
          - os: windows-latest
            label: Windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            label: Linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: Linux-arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force -s - "target/${{ matrix.target }}/release/desksync"

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_REF_NAME#v}"
          if [ "$ref" = "${GITHUB_REF_NAME}" ]; then
            version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          else
            version="$ref"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          name="DeskSync-$version-${{ matrix.label }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/desksync" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          shasum -a 256 "dist/$name.tar.gz" | awk '{print $1}' > "dist/$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '^v',''
          if ($ref -eq $env:GITHUB_REF_NAME) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          } else { $version = $ref }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          $name = "DeskSync-$version-${{ matrix.label }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/desksync.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value $hash -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSync-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
