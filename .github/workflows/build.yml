name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_FEATURES: --features ui

jobs:
  # macOS 单独一个 job：Apple Silicon 机器上交叉编译 x86_64，再 lipo 成通用二进制。
  # 不走 macos-13（Intel runner 已排不上队，实测等 51 分钟仍拿不到机器）。
  macos:
    name: macOS-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      # ${{ env.BIN_FEATURES }} 是 Actions 表达式：bash 和 pwsh 里都能正确展开。
      # 之前写成 $BIN_FEATURES，Windows job 的默认 shell 是 pwsh，PowerShell 里它是未定义变量
      # → 静默变成空串 → 编出来的 exe 没有 ui 特性 → 双击只跑后台，永远不出窗口。
      # 下面每个平台都加了「界面支持: 是」的闸门，防止复发。
      - run: cargo build --release --locked ${{ env.BIN_FEATURES }} --target aarch64-apple-darwin
      - run: cargo build --release --locked ${{ env.BIN_FEATURES }} --target x86_64-apple-darwin

      - name: 确认构建包含界面
        run: |
          ./target/x86_64-apple-darwin/release/desksync status
          ./target/x86_64-apple-darwin/release/desksync status | grep -q "界面支持: 是" \
            || { echo "这个二进制没编译进界面"; exit 1; }

      - name: Build app bundle, dmg and pkg
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSync-macOS-universal
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Build
        run: cargo build --release --locked ${{ env.BIN_FEATURES }} --target x86_64-pc-windows-msvc

      - name: Verify the binary exists
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/desksync.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不在 $exe" }
          & ".\$exe" status
          Get-Item $exe | Select-Object FullName, Length

      # 闸门：pwsh 里变量语义和 bash 不一样，必须显式确认界面真的编进去了。
      - name: 确认构建包含界面
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/desksync.exe"
          $out = & ".\$exe" status | Out-String
          Write-Host $out
          if ($out -notmatch "界面支持: 是") {
            throw "这个 exe 没有界面：双击只会静默跑后台。检查 BIN_FEATURES 有没有正确传给 cargo"
          }

      # 信息性冒烟：真跑一次界面，看它在这个无 GPU 的 runner 上能不能起来。
      # 只报告不阻断——runner 是虚拟显卡，起不来不代表用户机器上起不来。
      - name: 界面冒烟（信息性）
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/x86_64-pc-windows-msvc/release/desksync.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          $alive = -not $p.HasExited
          Write-Host "界面进程是否存活: $alive (pid=$($p.Id))"
          if (-not $alive) { Write-Host "退出码: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          $log = "$env:LOCALAPPDATA\DeskSync\desksync.log"
          if (Test-Path $log) {
            Write-Host "=== desksync.log 尾部 ==="
            Get-Content $log -Tail 30
          } else {
            Write-Host "没有日志文件：$log"
          }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '^v',''
          if ($ref -eq $env:GITHUB_REF_NAME) {
            $ref = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          "value=$ref" >> $env:GITHUB_OUTPUT

      # 便携版：解压即用，不需要安装
      - name: Package portable zip
        shell: pwsh
        run: |
          $name = "DeskSync-${{ steps.ver.outputs.value }}-Windows-x64-portable"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/desksync.exe "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value $hash -NoNewline

      # 安装器：Inno Setup（runner 自带）
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC：$iscc" }
          & $iscc "packaging\windows.iss" "/DMyAppVersion=${{ steps.ver.outputs.value }}"
          $exe = "dist\DeskSync-${{ steps.ver.outputs.value }}-Windows-x64-Setup.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$exe.sha256" -Value $hash -NoNewline
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSync-Windows-x64
          path: dist/*
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: Linux-arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        run: |
          sudo apt-get update
          # X11/Xtst：键鼠捕获；xdo：Linux 端注入；GTK/AppIndicator：托盘图标；xcb/xkbcommon：窗口
          sudo apt-get install -y libx11-dev libxtst-dev libxdo-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --locked ${{ env.BIN_FEATURES }} --target ${{ matrix.target }}

      - name: 确认构建包含界面
        run: |
          ./target/${{ matrix.target }}/release/desksync status
          ./target/${{ matrix.target }}/release/desksync status | grep -q "界面支持: 是" \
            || { echo "这个二进制没编译进界面"; exit 1; }

      - name: Package
        shell: bash
        run: |
          chmod +x scripts/package-linux.sh
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          ./scripts/package-linux.sh "${{ matrix.target }}" "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSync-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [macos, windows, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.dmg *.pkg *.exe > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
