name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # macOS 单独一个 job：Apple Silicon 机器上交叉编译 x86_64，再 lipo 成通用二进制。
  # 不走 macos-13（Intel runner 已排不上队，实测等 51 分钟仍拿不到机器）。
  macos:
    name: macOS-universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - run: cargo build --release --locked --features ui --target aarch64-apple-darwin
      - run: cargo build --release --locked --features ui --target x86_64-apple-darwin

      - name: Build app bundle, dmg and pkg
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSync-macOS-universal
          path: dist/*
          if-no-files-found: error

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            label: Linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: Linux-arm64
            target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # X11：键鼠捕获；GTK/AppIndicator：托盘图标；xcb/xkbcommon：窗口
          sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev \
            libayatana-appindicator3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build
        run: cargo build --release --locked --features ui --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "${GITHUB_REF_NAME}" ] && version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p staged
          cp "target/${{ matrix.target }}/release/desksync" staged/desksync
          name="DeskSync-$version-${{ matrix.label }}"
          mkdir -p "dist/$name"
          cp staged/desksync "dist/$name/desksync"
          cp README.md LICENSE "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          rm -rf "dist/$name"
          shasum -a 256 "dist/$name.tar.gz" | awk '{print $1}' > "dist/$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '^v',''
          if ($ref -eq $env:GITHUB_REF_NAME) {
            $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          } else { $version = $ref }
          $name = "DeskSync-$version-${{ matrix.label }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/desksync.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          Remove-Item -Recurse "dist/$name"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "dist/$name.zip.sha256" -Value $hash -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: DeskSync-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [macos, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
