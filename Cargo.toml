[package]
name = "desksync"
version = "0.2.4"
edition = "2021"
description = "Share one keyboard, mouse and clipboard across Windows, macOS and Linux over LAN"
license = "MIT"
repository = "https://github.com/KiwiTK/DeskSync"
homepage = "https://github.com/KiwiTK/DeskSync"
readme = "README.md"
keywords = ["kvm", "mouse", "keyboard", "clipboard", "lan"]
categories = ["command-line-utilities"]

[[bin]]
name = "desksync"
path = "src/main.rs"

[dependencies]
arboard = "3"
eframe = { version = "0.31", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
muda = { version = "0.16", optional = true }
rcgen = { version = "0.13", features = ["crypto", "ring"] }
rdev = { version = "0.5", features = ["serialize"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tray-icon = { version = "0.20", optional = true }

# 体积优先：最小体积优化 + 全量 LTO + 单编译单元。
# panic 用 unwind 而不是 abort：某个连接线程出问题时不该把整个后台服务一起带走。
# 只剥 DWARF、保留符号表，这样崩溃日志里的 backtrace 才有函数名可看；
# 等 Windows 启动问题彻底查清后可以改回 strip = "symbols"，还能再小一点。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[features]
# 图形界面（菜单栏图标 + 设置窗口）。不带这个特性编译出来的还是 1.3MB 的纯命令行内核。
ui = ["dep:eframe", "dep:tray-icon", "dep:muda", "dep:image"]

[build-dependencies]
winresource = "0.1.34"
